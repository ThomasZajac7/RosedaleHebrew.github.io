<!DOCTYPE html>
<html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">

    <!--   Stops making browser look for an icon for the website   -->
    <link rel="icon" href="data:,">
    
<link rel="stylesheet" href="stylesheet.css">

<title>RBC: Hebrew Vocab</title>

<body>
    <div class="horizontal-center">
        <h1>Hebrew Vocab</h1>
        <div id="card">
        </div>
        <div>
            <button id="correct">Correct</button>
            <button id="show">Show</button>
            <button id="wrong">Wrong</button>
        </div>
        <div>
            <label for=startRange>Chapters:</label>
            <input type="number" id="start-range" value="3"></input>
            <input type="number" id="end-range" value="6"></input>

            <button id="submit-chapters-button">Set</button>

        </div>
        <div id="info"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
